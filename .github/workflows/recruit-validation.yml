name: Validación MR&B Recruit

on:
  pull_request:
    branches:
      - feature/recruit-automation-v3
permissions:
  contents: read

jobs:
  validar-recruit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      mongodb:
        image: mongo:7.0
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ping:1}).ok'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Obtener código
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Configurar Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      - name: Instalar dependencias del backend
        run: npm ci --prefix backend

      - name: Ejecutar pruebas del backend con MongoDB temporal
        env:
          RECRUIT_TEST_MONGODB_URI: mongodb://127.0.0.1:27017
          DISPATCH_TEST_MONGODB_URI: mongodb://127.0.0.1:27017
        run: node --test backend/tests/*.test.js

      - name: Instalar dependencias del frontend
        run: npm ci --prefix frontend

      - name: Compilar frontend
        run: npm run build --prefix frontend
